<!doctype html>
<html lang="ko">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>로비 디펜스 · 캐릭터 동작</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #122327;
        --panel: #20383c;
        --text: #fcf6df;
        --muted: #b5cbca;
        --line: #476065;
        --mint: #99e4d5
      }

      * {
        box-sizing: border-box
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.45 "Apple SD Gothic Neo", "Malgun Gothic", sans-serif
      }

      main {
        max-width: 1120px;
        margin: auto;
        padding: 36px 30px 55px
      }

      h1 {
        font-size: clamp(30px, 4vw, 49px);
        margin: 0;
        line-height: 1.1;
        letter-spacing: -.05em
      }

      .page-heading {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 22px;
      }

      .page-heading a {
        color: var(--mint);
        text-underline-offset: 3px;
      }

      .page-heading nav {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      .compass {
        display: grid;
        grid-template-columns: repeat(3, 38px);
        gap: 3px;
      }

      .compass button { height: 34px; }
      .compass button:nth-child(5) { grid-column: 3; }
      .mirrored { scale: -1 1; }

      .stage.has-blocker #sprite,
      .stage.has-blocker #blocker {
        position: absolute;
        translate: -50% -50%;
      }

      .stage.has-blocker #sprite {
        left: var(--actor-x);
        top: var(--actor-y);
        width: var(--actor-size);
        z-index: 1;
      }

      #blocker {
        left: var(--target-x);
        top: var(--target-y);
        width: var(--target-size);
      }

      .has-blocker.contact #blocker {
        left: calc(var(--target-x) + var(--impact-x));
        top: calc(var(--target-y) + var(--impact-y));
      }

      h2 {
        font-size: 18px;
        margin: 24px 0 10px
      }

      button {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
        border-radius: 9px
      }

      button:hover {
        background: #2d484b
      }

      button:focus-visible {
        outline: 3px solid var(--mint);
        outline-offset: 3px
      }

      button[aria-pressed=true] {
        background: #264e50;
        border-color: var(--mint);
        color: white
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(255px, 34%) 1fr;
        gap: 32px
      }

      .list {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px
      }

      .unit {
        padding: 3px;
        aspect-ratio: 1;
        min-width: 0;
        background: var(--panel)
      }

      .unit img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block
      }

      .viewer {
        background: #192f33;
        border: 1px solid var(--line);
        padding: 18px 20px 20px;
        border-radius: 14px
      }

      .heading {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap
      }

      .heading h2 {
        font-size: 28px;
        letter-spacing: -.04em;
        margin: 0
      }

      .heading p {
        margin: 0;
        color: var(--muted)
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 14px 0
      }

      .tabs button,
      .control {
        padding: 5px 13px
      }

      .stage {
        position: relative;
        overflow: hidden;
        border-radius: 9px;
        background: radial-gradient(ellipse at center, #325659, #243e42 67%);
        display: grid;
        place-items: center;
        aspect-ratio: 1.85
      }

      .sprite {
        background-repeat: no-repeat;
        background-size: 200% 200%;
        width: min(80%, 260px);
        aspect-ratio: 1
      }

      .sprite.portrait {
        background-size: contain;
        background-position: center !important
      }

      .stage.has-flight .sprite {
        position: absolute;
        width: min(46%, 250px);
        left: 75%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      #flight {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      #flight img {
        position: absolute;
      }

      .shot-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        color: var(--mint);
        text-underline-offset: 3px;
      }

      .shot-link img {
        width: 42px;
        height: 42px;
        border-radius: 6px;
        background: var(--panel);
      }

      .strip {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-top: 12px
      }

      .frame {
        padding: 0;
        border-radius: 6px;
        background-color: #284347;
        background-repeat: no-repeat;
        background-size: 200% 200%;
        aspect-ratio: 1
      }

      .status {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 11px;
        color: var(--muted);
        font-size: 14px
      }

      .status p {
        margin: 0
      }

      aside h2:first-child {
        margin-top: 0
      }

      [hidden] {
        display: none !important
      }

      @media(max-width:730px) {
        main {
          padding: 24px 16px
        }

        .layout {
          grid-template-columns: 1fr;
          gap: 20px
        }

        aside {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 12px
        }

        aside h2 {
          margin: 0 0 8px
        }

        .list {
          grid-template-columns: repeat(5, minmax(0, 1fr));
          gap: 3px
        }

        .unit {
          border-radius: 5px
        }

        .stage {
          aspect-ratio: 1.55
        }

        .sprite {
          width: min(73%, 240px)
        }

        .viewer {
          padding: 14px
        }

        .heading h2 {
          font-size: 24px
        }
      }

      @media(prefers-reduced-motion:reduce) {
        * {
          scroll-behavior: auto
        }
      }
    </style>
  </head>

  <body>
    <main>
      <header class="page-heading">
        <h1>로비 디펜스 캐릭터</h1>
        <nav aria-label="모아보기">
          <a href="InvaderDirections.gif">침공 몬스터 8방향 보기</a>
          <a href="LobbyDefenseProjectiles.jpg">투사체 13종 모아보기</a>
        </nav>
      </header>
      <div class="layout">
        <aside aria-label="캐릭터 목록">
          <section>
            <h2>디펜스 유닛</h2>
            <div class="list" id="defenders"></div>
          </section>
          <section>
            <h2>침공 몬스터</h2>
            <div class="list" id="monsters"></div>
            <div id="facing" hidden>
              <h3 id="facing-label">보는 방향</h3>
              <div class="compass" id="compass" role="group" aria-labelledby="facing-label"></div>
            </div>
          </section>
        </aside>
        <section class="viewer" aria-label="캐릭터 미리보기">
          <div class="heading">
            <h2 id="name"></h2>
            <p id="role"></p>
          </div>
          <div id="tabs" class="tabs" aria-label="동작 선택"></div>
          <div class="stage" id="stage">
            <div id="sprite" class="sprite" role="img"></div>
            <img id="blocker" src="../../../Assets/04_Resources/Images/LobbyDefense/Defenders/ClamShield.png" alt="길을 막은 조개방패 소라게" hidden>
            <div id="flight" aria-hidden="true"></div>
          </div>
          <a id="shot-link" class="shot-link" hidden><img id="shot-icon" alt=""><span id="shot-name"></span></a>
          <div id="playback">
            <div class="status"><button type="button" id="play" class="control">일시 정지</button>
              <p id="timing"></p>
            </div>
            <div id="strip" class="strip" aria-label="개별 프레임"></div>
          </div>
        </section>
      </div>
    </main>
    <script>
      "use strict";
      const roster = [
        {"side": "Monsters", "id": "WaveJelly", "name": "물방울 젤리", "role": "일반 몬스터"},
        {"side": "Monsters", "id": "PebbleCrab", "name": "조약돌 집게", "role": "일반 몬스터"},
        {"side": "Monsters", "id": "ReedRunner", "name": "갈대도마뱀", "role": "일반 몬스터"},
        {"side": "Monsters", "id": "ScoreImp", "name": "별핵도깨비", "role": "퍼즐 점수로 소환되는 몬스터"},
        {"side": "Monsters", "id": "PathWarden", "name": "길지기 유령", "role": "5초마다 소환되는 통행 관리 유령"},
        {"side": "Defenders", "id": "PearlSentry", "name": "진주 수비병", "role": "기본 공격 유닛"},
        {"side": "Defenders", "id": "SeedFinch", "name": "씨앗새 사수", "role": "원거리 공격 유닛 시안"},
        {"side": "Defenders", "id": "BellOwl", "name": "방울부엉이", "role": "범위 공격 유닛 시안"},
        {"side": "Defenders", "id": "EmberGecko", "name": "불씨도롱뇽", "role": "공격 유닛 시안"},
        {"side": "Defenders", "id": "RingRay", "name": "고리 가오리", "role": "공격 유닛 시안"},
        {"side": "Defenders", "id": "InkOcto", "name": "먹방울 문어", "role": "공격 유닛 시안"},
        {"side": "Defenders", "id": "RampartTurtle", "name": "성벽거북", "role": "길막 유닛"},
        {"side": "Defenders", "id": "ClamShield", "name": "조개방패 소라게", "role": "길막 유닛"},
        {"side": "Defenders", "id": "StonePangolin", "name": "돌갑옷 천산갑", "role": "길막 유닛"},
        {"side": "Defenders", "id": "CoilFrog", "name": "코일개구리 정비사", "role": "마비 트랩을 모티프로 한 유닛 시안"}
      ];
      const actions = {Profile: "프로필", Idle: "대기", Attack: "공격", Special: "스페셜", Walk: "걷기"};
      const fps = {Idle: 4, Attack: 8, Special: 6, Walk: 8};
      const bearings = {
        NorthWest: {name: "왼쪽 위", arrow: "↖", source: "NorthEast", x: -1, y: -1},
        North:     {name: "위", arrow: "↑", source: "North", x: 0, y: -1},
        NorthEast: {name: "오른쪽 위", arrow: "↗", source: "NorthEast", x: 1, y: -1},
        West:      {name: "왼쪽", arrow: "←", source: "East", x: -1, y: 0},
        East:      {name: "오른쪽", arrow: "→", source: "East", x: 1, y: 0},
        SouthWest: {name: "왼쪽 아래", arrow: "↙", source: "SouthEast", x: -1, y: 1},
        South:     {name: "아래", arrow: "↓", source: "South", x: 0, y: 1},
        SouthEast: {name: "오른쪽 아래", arrow: "↘", source: "SouthEast", x: 1, y: 1}
      };
      let bearing = "East";
      // Origin is the leading edge of the release effect, in top-left frame coordinates.
      const projectiles = {
        PearlSentry: {
          Attack: {name: "진주 방울", origin: [0.13, 0.44], size: 0.19},
          Special: {name: "진주 물결", origin: [0.10, 0.50], size: 0.38}
        },
        SeedFinch: {
          Attack: {name: "도토리 씨앗", origin: [0.12, 0.43], size: 0.15},
          Special: {name: "황금 씨앗", origin: [0.09, 0.42], size: 0.18, pattern: "fan"}
        },
        BellOwl: {
          Attack: {name: "종소리 파동", origin: [0.13, 0.52], size: 0.24},
          Special: {name: "겹음파", origin: [0.09, 0.62], size: 0.36}
        },
        EmberGecko: {
          Attack: {name: "불씨", origin: [0.10, 0.32], size: 0.20},
          Special: {name: "도롱뇽 불꽃", origin: [0.08, 0.34], size: 0.39}
        },
        RingRay: {Attack: {name: "회전 고리", origin: [0.13, 0.56], size: 0.25, pattern: "return"}},
        InkOcto: {
          Attack: {name: "먹방울", origin: [0.13, 0.50], size: 0.19},
          Special: {name: "먹물 소용돌이", origin: [0.08, 0.54], size: 0.38}
        },
        CoilFrog: {
          Attack: {name: "전기 불티", origin: [0.15, 0.45], size: 0.21},
          Special: {name: "갈래 번개", origin: [0.10, 0.26], size: 0.39}
        }
      };
      const base = "../../../Assets/04_Resources/Images/LobbyDefense/";
      const get = id => document.getElementById(id);
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let selected, action, frame, running, start, timer, shot;
      let elapsed = 0;

      function prepareFlight() {
        shot = projectiles[selected.id]?.[action];
        const layer = get("flight");
        layer.replaceChildren();
        get("stage").classList.toggle("has-flight", Boolean(shot));
        get("shot-link").hidden = !shot;
        if (!shot) return;

        const src = base + "Projectiles/" + selected.id + "/" + action + ".png";
        get("shot-link").href = src;
        get("shot-icon").src = src;
        get("shot-name").textContent = shot.name + " PNG";
        const count = shot.pattern === "fan" ? 3 : 1;
        for (let i = 0; i < count; i++) {
          const image = new Image();
          image.alt = "";
          image.src = src;
          image.hidden = true;
          layer.appendChild(image);
        }
      }

      function flightTime() {
        return shot?.pattern === "return" ? 900 : 650;
      }

      function drawFlight() {
        if (!shot) return;
        const phase = (elapsed - 2000 / fps[action]) / flightTime();
        const layer = get("flight");
        layer.hidden = phase < 0 || phase >= 1;
        if (layer.hidden) return;

        const stage = get("stage").getBoundingClientRect();
        const actor = get("sprite").getBoundingClientRect();
        const size = actor.width * shot.size;
        const launchX = actor.left - stage.left + actor.width * shot.origin[0];
        const launchY = actor.top - stage.top + actor.height * shot.origin[1];
        const returning = shot.pattern === "return";
        const distance = returning ? Math.sin(Math.PI * phase) : phase;
        const catchProgress = returning ? Math.max(0, phase * 2 - 1) : 0;
        const catchX = actor.left - stage.left + actor.width * 0.44;
        const x = launchX + (stage.width * 0.10 - launchX) * distance + (catchX - launchX) * catchProgress;
        for (const [index, image] of Array.from(layer.children).entries()) {
          const spread = shot.pattern === "fan" ? (index - 1) * actor.height * 0.25 * phase : 0;
          const arc = returning ? Math.sin(phase * 2 * Math.PI) * actor.height * 0.07 : 0;
          const angle = returning ? -300 * phase : 0;
          image.hidden = false;
          image.style.width = size + "px";
          image.style.left = x + "px";
          image.style.top = (launchY + spread - arc) + "px";
          image.style.transform = "translate(-50%, -50%) rotate(" + angle + "deg)";
          image.style.opacity = Math.min(1, (1 - phase) * 9);
        }
      }

      function url(unit, mode) {
        if (mode === "Profile") return base + "Profiles/" + unit.id + ".png";
        if (unit.side === "Monsters" && bearings[bearing].source !== "East") {
          return base + "Motions/" + unit.id + "/Directions/" + unit.id + "_" + mode + "_" + bearings[bearing].source + ".png";
        }
        return base + "Motions/" + unit.id + "/" + unit.id + "_" + mode + ".png";
      }

      function placeBlocker() {
        if (get("blocker").hidden) return;
        const stage = get("stage");
        const {x, y} = bearings[bearing];
        const size = Math.min(stage.clientWidth * 0.49, stage.clientHeight * 0.58, 235);
        const diagonal = x !== 0 && y !== 0;
        const dx = x * size * (diagonal ? 0.43 : 0.63);
        const dy = y * size * (diagonal ? 0.32 : 0.49);
        const metrics = {
          "actor-size": size, "target-size": size * 0.8,
          "actor-x": (stage.clientWidth - dx) / 2, "actor-y": (stage.clientHeight - dy) / 2,
          "target-x": (stage.clientWidth + dx) / 2, "target-y": (stage.clientHeight + dy) / 2,
          "impact-x": x * size * 0.035, "impact-y": y * size * 0.035
        };
        for (const [key, value] of Object.entries(metrics)) stage.style.setProperty("--" + key, value + "px");
        get("blocker").classList.toggle("mirrored", x < 0);
        get("blocker").style.zIndex = y > 0 ? "2" : "0";
      }

      function updateBearing() {
        const monster = selected.side === "Monsters";
        const direction = bearings[bearing];
        const flip = monster && direction.x < 0;
        const source = 'url("' + url(selected, action) + '")';
        get("facing").hidden = !monster;
        get("facing-label").textContent = "보는 방향 · " + direction.name;
        for (const button of get("compass").children) {
          button.setAttribute("aria-pressed", String(button.dataset.bearing === bearing));
        }
        for (const part of [get("sprite"), ...get("strip").children]) {
          part.classList.toggle("mirrored", flip);
          part.style.backgroundImage = source;
        }
        get("sprite").setAttribute("aria-label", [selected.name, monster ? direction.name : "", actions[action]].filter(Boolean).join(" "));
        const blocked = monster && action === "Attack";
        get("stage").classList.toggle("has-blocker", blocked);
        get("blocker").hidden = !blocked;
        placeBlocker();
      }

      function position(index) {
        const left = index % 2 ? "100%" : "0%";
        const top = index > 1 ? "100%" : "0%";
        return left + " " + top;
      }

      function chooseFrame(index) {
        frame = index;
        get("stage").classList.toggle("contact", index === 2 && !get("blocker").hidden);
        get("sprite").style.backgroundPosition = position(index);
        Array.from(get("strip").children).forEach((button, n) => {
          button.setAttribute("aria-pressed", String(n === index));
        });
      }

      function play(value) {
        running = value;
        cancelAnimationFrame(timer);
        get("play").textContent = value ? "일시 정지" : "재생";
        if (value) {
          start = performance.now() - elapsed;
          step();
        }
      }

      function step() {
        if (!running) return;
        const frameTime = 1000 / fps[action];
        const loop = action === "Idle" || action === "Walk";
        const end = shot ? 2 * frameTime + flightTime() : 4 * frameTime;
        elapsed = performance.now() - start;
        if (loop) elapsed %= 4 * frameTime;
        else elapsed = Math.min(elapsed, end);
        const next = Math.min(3, Math.floor(elapsed / frameTime));
        if (next !== frame) chooseFrame(next);
        drawFlight();
        if (!loop && elapsed >= end) {
          play(false);
          return;
        }
        timer = requestAnimationFrame(step);
      }

      function show(mode) {
        play(false);
        action = mode;
        frame = 0;
        elapsed = 0;
        prepareFlight();
        const portrait = mode === "Profile";
        for (const button of get("tabs").children) {
          button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
        }
        const sprite = get("sprite");
        sprite.classList.toggle("portrait", portrait);
        get("playback").hidden = portrait;
        get("strip").replaceChildren();
        if (portrait) {
          updateBearing();
          return;
        }

        for (let i = 0; i < 4; i++) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "frame";
          button.style.backgroundPosition = position(i);
          button.setAttribute("aria-label", (i + 1) + "번 프레임");
          button.onclick = () => {
            play(false);
            elapsed = i * 1000 / fps[mode];
            chooseFrame(i);
            drawFlight();
          };
          get("strip").appendChild(button);
        }
        const loop = mode === "Idle" || mode === "Walk";
        get("timing").textContent = fps[mode] + " FPS · " + (loop ? "반복" : "1회");
        updateBearing();
        chooseFrame(0);
        if (!reduce) play(true);
      }

      function select(unit) {
        selected = unit;
        get("name").textContent = unit.name;
        get("role").textContent = unit.role;
        for (const button of document.querySelectorAll(".unit")) {
          button.setAttribute("aria-pressed", String(button.dataset.id === unit.id));
        }
        const isMonster = unit.side === "Monsters";
        const modes = isMonster ? ["Walk", "Attack"] : ["Profile", "Idle", "Attack", "Special"];
        get("tabs").replaceChildren();
        for (const mode of modes) {
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.mode = mode;
          button.textContent = actions[mode];
          button.onclick = () => show(mode);
          get("tabs").appendChild(button);
        }
        const defaultMode = isMonster ? "Walk" : "Idle";
        show(modes.includes(action) ? action : defaultMode);
      }

      for (const unit of roster) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "unit";
        button.title = unit.name;
        button.dataset.id = unit.id;
        button.setAttribute("aria-label", unit.name);
        const icon = document.createElement("img");
        icon.alt = "";
        const isMonster = unit.side === "Monsters";
        icon.src = isMonster ? base + "Monsters/" + unit.id + ".png" : url(unit, "Profile");
        button.appendChild(icon);
        button.onclick = () => select(unit);
        get(isMonster ? "monsters" : "defenders").appendChild(button);
      }
      get("play").onclick = () => {
        const end = shot ? 2000 / fps[action] + flightTime() : 4000 / fps[action];
        if (!running && elapsed >= end) elapsed = 0;
        play(!running);
      };
      for (const [key, direction] of Object.entries(bearings)) {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.bearing = key;
        button.textContent = direction.arrow;
        button.title = direction.name;
        button.setAttribute("aria-label", direction.name);
        button.onclick = () => {
          bearing = key;
          updateBearing();
        };
        get("compass").appendChild(button);
      }
      window.addEventListener("resize", () => { placeBlocker(); drawFlight(); });
      const [unitId, mode, initialBearing] = location.hash.slice(1).split("/");
      if (Object.hasOwn(bearings, initialBearing)) bearing = initialBearing;
      const initial = roster.find(unit => unit.id === unitId) || roster.find(unit => unit.id === "PearlSentry");
      select(initial);
      if (Array.from(get("tabs").children).some(button => button.dataset.mode === mode)) show(mode);
    </script>
  </body>

</html>
